image: gitpod/workspace-full

tasks:
  - init: |
      docker-compose up -d --build
      # Install composer deps inside container (optional)
      docker exec -u www-data hana_app composer install --no-interaction --prefer-dist
    command: |
      echo "Waiting for services..."
ports:
  - port: 8080
    onOpen: open-preview
  - port: 8081
    onOpen: open-preview

vscode:
  extensions:
    - ms-azuretools.vscode-docker
