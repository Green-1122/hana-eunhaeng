version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: hana-eunhaeng_app:latest
    container_name: hana_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      - db
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=1
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hana_eunhaeng
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    networks:
      - hana-net

  nginx:
    image: nginx:stable
    container_name: hana_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      - app
    networks:
      - hana-net

  db:
    image: mysql:8.0
    container_name: hana_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: hana_eunhaeng
    ports:
      - "3306:3306"
    volumes:
      - hana_db_data:/var/lib/mysql
    networks:
      - hana-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hana_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - hana-net

  redis:
    image: redis:7
    container_name: hana_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hana-net

volumes:
  hana_db_data:

networks:
  hana-net:
    driver: bridge
