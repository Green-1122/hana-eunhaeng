# Docker Compose Configuration
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hana-eunhaeng
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_NAME=hana_eunhaeng
      - DB_USER=hana_user
      - DB_PASS=secure_password
    depends_on:
      - mysql
    networks:
      - hana-network

  mysql:
    image: mysql:8.0
    container_name: hana-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hana_eunhaeng
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: secure_password
      MYSQL_USER: hana_user
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - hana-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hana-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: hana_user
      PMA_PASSWORD: secure_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - hana-network

volumes:
  mysql_data:

networks:
  hana-network:
    driver: bridge
